# Module Integration Test Jobs
# ==============================
#
# Architecture:
#   - LzaGitlabRole (admin): Used by GitLab runner for prereq infrastructure and
#     module role/boundary management. Has AdministratorAccess.
#   - LzaIntegTest-{Module}-Role: Per-module role created by the framework at runtime.
#     Has AdministratorAccess + permissions boundary matching the module's session policy.
#     Used by the module for cross-account operations (replaces session policies).
#
# Why not session policies?
#   GitLab credential vendor attaches 8 transitive session tags that persist through
#   the AssumeRole chain. Combined with a session policy, they exceed the STS 2048-byte
#   packed policy limit. Permissions boundaries achieve the same restriction without
#   this constraint.
#
# All jobs assume role into the management account via AWS_CREDS_TARGET_ROLE (LzaGitlabRole).
# Cross-account admin access (for role/boundary setup) uses the same LzaGitlabRole
# which exists in every account with a trust policy allowing the management account role.
#
# Required GitLab CI variables (project/group level):
#   ACCELERATOR_PREFIX          - e.g. LzaIntegTest
#   LZA_GITLAB_ROLE_NAME        - e.g. LzaGitlabRole (admin role in all accounts)
#   EXECUTE_INTEGRATION_TEST    - "Yes" to force all tests, "No" to disable all
#   SAMPLE_CONFIG_ENV_MANAGEMENT_ACCOUNT_ID
#   SAMPLE_CONFIG_ENV_LOGARCHIVE_ACCOUNT_ID
#
# Rule Logic
# ----------
#
# All jobs:
#   1. EXECUTE_INTEGRATION_TEST=No  → never run (explicit kill switch)
#   2. EXECUTE_INTEGRATION_TEST=Yes → always run (force all, no file-change check)
#   3. Remote repo (CI_PROJECT_ID=21753) + integ branch + module files changed → run
#   4. Otherwise → never
#
# When EXECUTE_INTEGRATION_TEST is not set, jobs only run on the integ branch
# in the upstream repo when relevant module files have changed.
# Prereq job always runs when any module job runs (idempotent infrastructure).

# ============================================================
# Prerequisites: deploy shared test infrastructure (once)
# ============================================================
integ:prereq:aws:us-east-1:
  stage: pipeline
  needs: ["accelerator:build"]
  variables:
    ENV_NAME: sampleConfig
    ACCOUNT_ID: "${SAMPLE_CONFIG_ENV_MANAGEMENT_ACCOUNT_ID}"
    LOGARCHIVE_ACCOUNT_ID: "${SAMPLE_CONFIG_ENV_LOGARCHIVE_ACCOUNT_ID}"
    PARTITION: aws
    AWS_DEFAULT_REGION: us-east-1
    AWS_CREDS_TARGET_ROLE: "arn:${PARTITION}:iam::${ACCOUNT_ID}:role/${LZA_GITLAB_ROLE_NAME}"
  tags:
    - arch:amd64
  script:
    - wget --progress=dot:mega -O /tmp/awscliv2.zip https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
    - unzip -q /tmp/awscliv2.zip -d /tmp
    - /tmp/aws/install
    - "cd source/packages/@aws-accelerator/accelerator/test/integration/infrastructure"
    - "bash deploy-integ-prereqs.sh ${ACCELERATOR_PREFIX} ${AWS_DEFAULT_REGION} ${ACCOUNT_ID} ${LOGARCHIVE_ACCOUNT_ID} ${PARTITION} ${LZA_GITLAB_ROLE_NAME}"
  artifacts:
    reports:
      dotenv: "source/packages/@aws-accelerator/accelerator/test/integration/infrastructure/integ-prereqs.env"
    expire_in: 1 day
  rules:
    - if: $CI_MERGE_REQUEST_IID != null
      when: never
    - if: $EXECUTE_INTEGRATION_TEST == "No"
      when: never
    - if: $EXECUTE_INTEGRATION_TEST == "Yes"
      when: always
    - if: $CI_PROJECT_ID == "21753" && $CI_COMMIT_BRANCH == "integ"
      when: always
    - when: never

# ============================================================
# Macie module integration test
# ============================================================
integ:macie:aws:us-east-1:
  stage: pipeline
  resource_group: integ-macie-us-east-1
  needs:
    - job: accelerator:build
      artifacts: true
    - job: integ:prereq:aws:us-east-1
      artifacts: true
  variables:
    ENV_NAME: sampleConfig
    ACCOUNT_ID: "${SAMPLE_CONFIG_ENV_MANAGEMENT_ACCOUNT_ID}"
    PARTITION: aws
    AWS_DEFAULT_REGION: us-east-1
    AWS_CREDS_TARGET_ROLE: "arn:${PARTITION}:iam::${ACCOUNT_ID}:role/${LZA_GITLAB_ROLE_NAME}"
    # Enable CloudWatch verbose logging — log group created by prereq infrastructure
    VERBOSE_LOG_GROUP_NAME: "${ACCELERATOR_PREFIX}-Module-Verbose-Logs"
    PIPELINE_ACCOUNT_ID: "${SAMPLE_CONFIG_ENV_MANAGEMENT_ACCOUNT_ID}"
    ACCELERATOR_STAGE: "integ-macie"
    # LOGGING_BUCKET_NAME and LOGGING_BUCKET_KEY_ARN are injected from
    # the prereq job's dotenv artifact (actual KMS key ARN, not alias).
  tags:
    - arch:amd64
  script:
    - "cd source/packages/@aws-accelerator/accelerator"
    # Publish scenario descriptions.
    - "npx ts-node --transpile-only test/integration/framework/aggregate-manifests.ts macie 'Amazon Macie' > $CI_PROJECT_DIR/integ-manifest-macie.json"
    - "yarn test:integration test/integration/modules/macie/index.test.integration.ts"
  artifacts:
    when: always
    reports:
      junit: "source/packages/@aws-accelerator/accelerator/test-reports/integration-results.xml"
    paths:
      - integ-manifest-macie.json
    expire_in: 7 days
  timeout: 15m
  rules:
    - if: $CI_MERGE_REQUEST_IID != null
      when: never
    - if: $EXECUTE_INTEGRATION_TEST == "No"
      when: never
    - if: $EXECUTE_INTEGRATION_TEST == "Yes"
      when: always
    - if: $CI_PROJECT_ID == "21753" && $CI_COMMIT_BRANCH == "integ"
      changes:
        - source/packages/@aws-lza/lib/amazon-macie/**/*
        - source/packages/@aws-accelerator/accelerator/lib/actions/security/amazon-macie*
        - source/packages/@aws-accelerator/accelerator/test/integration/modules/macie/**/*
      when: always
    - when: never

