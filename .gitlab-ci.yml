# GitLab CI/CD Rules Documentation
# ==============================
#
# Rule Patterns and Their Meanings
# -----------------------------
#
# 1. Skip Main Branch Rule
# ---------------------
# if: $CI_COMMIT_BRANCH == "main"
# when: never
# Meaning: Skip the job when the pipeline runs on the main branch
#
# 2. Skip Version Branch Rule
# ------------------------
# if: $CI_COMMIT_BRANCH =~ /.*v(\d.+){2}\d$/
# when: never
# Meaning: Skip the job when the branch name ends with a version pattern
# Example matches: release-v1.0.0, feature-v2.3.4, hotfix-v10.2.1
#
# 3. Skip Merge Request Rule
# -----------------------
# if: $CI_MERGE_REQUEST_IID != null
# when: never
# Meaning: Skip the job when the pipeline runs in context of a merge request
#
# 4. Integration Test Execution Rules
# -------------------------------
# Location: '.gitlab/jobs/ci-job-definitions.yml'
#
# if: $EXECUTE_INTEGRATION_TEST == "Yes"
# when: always
# Meaning: Execute the job when the EXECUTE_INTEGRATION_TEST variable is set to "Yes"
#
# 5. Integration Branch Rules
# -----------------------
# Location: '.gitlab/jobs/ci-job-definitions.yml'
#
# if: $CI_COMMIT_BRANCH == "integ"
# when: always
# Meaning: Execute the job when the pipeline runs on the "integ" branch
#
# 6. Version Tag Rules
# -----------------
# if: $CI_COMMIT_TAG =~ /v(\d.+){2}\d/
# when: always
# Meaning: Execute the job when the pipeline runs on a tag matching version pattern
# Example matches: v1.0.0, v2.3.4, v10.2.1
#
# 7. Project-Specific Version Tag Rules
# --------------------------------
# if: $CI_PROJECT_ID == "21753" && $CI_COMMIT_TAG =~ /v(\d.+){2}\d/
# when: always
# Meaning: Execute the job only on specific project (21753) and when tag matches version pattern
#
# 8. Project-Specific Integration Branch Rules
# ---------------------------------------
# if: $CI_PROJECT_ID == "21753" && $CI_COMMIT_BRANCH == "integ"
# when: always
# Meaning: Execute the job only on specific project (21753) and on the "integ" branch
#
# 9. Default Skip Rule
# -----------------
# when: never
# Meaning: Skip the job if none of the above conditions match
#
# Rule Keywords Explained
# --------------------
# - if: Condition that must be true for the rule to apply
# - when: Defines job behavior
#   * always: Run job when conditions match
#   * never: Skip job (prevent execution)
#   * manual: Require manual intervention to run
#
# Variables Used in Rules
# --------------------
# CI_MERGE_REQUEST_IID:
#   - ID of the merge request if pipeline runs in MR context
#   - null when pipeline runs in other contexts
#
# CI_PROJECT_ID:
#   - GitLab's internal project identifier
#   - "21753" represents specific project
#
# CI_COMMIT_TAG:
#   - The tag name for which the pipeline is running
#   - Pattern v(\d.+){2}\d matches semantic versioning
#
# CI_COMMIT_BRANCH:
#   - The branch name for which the pipeline is running
#   - Special values: "main", "integ"
#   - Can match version pattern for release branches
#
# EXECUTE_INTEGRATION_TEST:
#   - Custom variable to control integration test execution
#   - "Yes" enables integration tests
#
# Regular Expression Patterns
# ------------------------
# 1. Version Tag Pattern: v(\d.+){2}\d
#    - v: Literal 'v' at start
#    - (\d.+){2}: Two groups of digits followed by any characters
#    - \d: Final digit
#    - Examples: v1.0.0, v2.3.4, v10.2.1
#
# 2. Version Branch Pattern: .*v(\d.+){2}\d$
#    - .*: Any characters at start
#    - v(\d.+){2}\d: Same version pattern as above
#    - $: End of string
#    - Examples: release-v1.0.0, feature-v2.3.4

image: public.ecr.aws/docker/library/node:22.15.0

before_script:
  - rm -rf /var/lib/apt/lists/*
  - apt-get update
  - apt-cache gencaches
  - apt-get install -y zip
  - apt-get install -y jq

include:
  # - '.gitlab/jobs/ci-job-definitions.yml'
  # Module integration test jobs
  - '.gitlab/jobs/security/integ-test.yaml'
  # Mirror jobs for CodeCommit replication
  - '.gitlab/jobs/mirror-job.yaml'
  - '.gitlab/jobs/mirror-universal-config-repo.yaml'

stages:
  - pipeline
  - mirror
  - security

variables:
  KUBERNETES_HELPER_MEMORY_REQUEST: "1Gi"
  KUBERNETES_HELPER_MEMORY_LIMIT: "2Gi"

accelerator:scan-sensitive-content:
  stage: pipeline
  tags:
    - arch:amd64
  variables:
    KUBERNETES_CPU_REQUEST: "1"
    KUBERNETES_CPU_LIMIT: "1"
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_MEMORY_LIMIT: "2Gi"
    # SENSITIVE_DOMAINS only needed in main repository
    # Forks will use basic pattern scanning automatically
    SCAN_EXCLUDE_DIRS: ".git node_modules build dist coverage"
    SCAN_EXCLUDE_FILES: "*.log *.zip *.tar.gz *.tgz"
  script:
    - echo "Running security scan for sensitive URLs and content..."
    - echo "Sensitive domains configured:" ${SENSITIVE_DOMAINS:-"(not set - will fail)"}
    - chmod +x .gitlab/scripts/security-scan.sh
    - ./.gitlab/scripts/security-scan.sh
  rules:
    - if: $CI_MERGE_REQUEST_IID != null
      when: never
    - when: always

accelerator:daily-vulnerability-scan:
  stage: security
  variables:
    KUBERNETES_CPU_REQUEST: "4"
    KUBERNETES_CPU_LIMIT: "4"
    KUBERNETES_MEMORY_REQUEST: "16Gi"
    KUBERNETES_MEMORY_LIMIT: "16Gi"
  tags:
    - arch:amd64
  script:
    - chmod +x .gitlab/scripts/vulnerability-scan.sh
    - chmod +x .gitlab/scripts/issue-manager.sh
    - ./.gitlab/scripts/vulnerability-scan.sh
    - ./.gitlab/scripts/issue-manager.sh
  artifacts:
    name: vulnerability-scan-results
    when: always
    paths:
      - software-dependency-findings.json
      - filtered-findings.json
      - masked-findings.json
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "Daily Vulnerability Scan" && $CI_COMMIT_BRANCH == "integ"
      when: always
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - when: never

accelerator:cve-remediation:
  stage: security
  needs: []
  variables:
    KUBERNETES_CPU_REQUEST: "4"
    KUBERNETES_CPU_LIMIT: "4"
    KUBERNETES_MEMORY_REQUEST: "16Gi"
    KUBERNETES_MEMORY_LIMIT: "16Gi"
    VULN_ASSIGNEE: "erwaxler"
  tags:
    - arch:amd64
  before_script:
    - apt-get update && apt-get install -y jq
    - git config user.email "lza-cve-bot@amazon.com"
    - git config user.name "LZA CVE Remediation Bot"
    - git remote set-url origin "https://oauth2:${VULN_SCAN_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - echo "Tools:" && yarn --version && jq --version && git --version
  script:
    - chmod +x .gitlab/scripts/cve-remediate.sh
    - ./.gitlab/scripts/cve-remediate.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "Daily Vulnerability Scan" && $CI_COMMIT_BRANCH == "integ"
      when: always
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - when: never
  artifacts:
    paths:
      - cve-remediation-report.json
    expire_in: 30 days
    when: always

accelerator:nightly-github-sync:
  stage: security
  variables:
    KUBERNETES_CPU_REQUEST: "1"
    KUBERNETES_CPU_LIMIT: "1"
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_MEMORY_LIMIT: "2Gi"
  tags:
    - arch:amd64
  allow_failure: true
  script:
    - chmod +x .gitlab/scripts/github-issue-sync.sh
    - ./.gitlab/scripts/github-issue-sync.sh
  artifacts:
    name: github-sync-results
    when: always
    paths:
      - github-sync-summary.json
      - failed-items.json
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "Nightly GitHub Sync" && $CI_COMMIT_BRANCH == "integ"
      when: always
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "integ" && $GITHUB_SYNC_ALLOW_MANUAL == "true"
      when: manual
    - when: never

accelerator:build:
  stage: pipeline
  variables:
    KUBERNETES_CPU_REQUEST: "16"
    KUBERNETES_CPU_LIMIT: "16"
    KUBERNETES_MEMORY_REQUEST: "64Gi"
    KUBERNETES_MEMORY_LIMIT: "64Gi"
  tags:
    - arch:amd64
  script:
    - "export NODE_OPTIONS=--max_old_space_size=49152"
    - "npm install yarn@1.22.22"
    - "cd source"
    - "yarn install"
    - "yarn build"
  artifacts:
    name: solution-build
    untracked: true
    when: on_success
    paths:
      - source
    expire_in: 3 hrs
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - if: $CI_COMMIT_BRANCH =~ /.*v(\d.+){2}\d$/
      when: never
    - if: $CI_MERGE_REQUEST_IID != null
      when: never
    - when: always
accelerator:lint:
  stage: pipeline
  needs: ["accelerator:build"]
  variables:
    KUBERNETES_CPU_REQUEST: "8"
    KUBERNETES_CPU_LIMIT: "8"
    KUBERNETES_MEMORY_REQUEST: "32Gi"
    KUBERNETES_MEMORY_LIMIT: "32Gi"
  tags:
    - arch:amd64
  script:
    - "export NODE_OPTIONS=--max_old_space_size=28672"
    - "npm install yarn@1.22.22"
    - "cd source"
    - "yarn install"
    - "yarn lint"
    - "yarn lerna run precommit --stream"
    - "export ACCELERATOR_PREFIX=AWSAccelerator"
    # - "yarn validate-config packages/@aws-accelerator/accelerator/test/configs/all-enabled/" # Validate all enabled config files
    # - "yarn validate-config packages/@aws-accelerator/accelerator/test/configs/no-org-config/" # Validate no-org config files"
    - "yarn git-clean"
    - "yarn run viper-scan"
    # Check if build  has changed any of the
    - git add -A
    - |
      if [[ -n $(git status --porcelain | grep -E 'source/packages/@aws-accelerator/config/lib/schemas/') ]]; then
        echo "Uncommitted changes or untracked files detected in schema folder listed below. Please run yarn build-clean locally, then commit and push the updated schema file to resolve."
        git status --porcelain | grep -E 'source/packages/@aws-accelerator/config/lib/schemas/'
        exit 1
      else
        echo "No changes or untracked files detected in schema folder"
      fi
    - git reset
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - if: $CI_COMMIT_BRANCH =~ /.*v(\d.+){2}\d$/
      when: never
    - if: $CI_COMMIT_TAG =~ /v(\d.+){2}\d/
      when: never
    - if: $CI_MERGE_REQUEST_IID != null
      when: never
    - when: always
accelerator:attribution-check:
  stage: pipeline
  variables:
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_REQUEST: "8Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
  tags:
    - arch:amd64
  script:
    - echo "This merge request contains commits from an external author and is incorrectly configured to squash commits, which can erase author attribution. Please set \"Squash commits on merge\" to false and retry the pipeline."
    - exit 1
  rules:
    - if: $CI_PROJECT_ID == "21753" && $CI_COMMIT_AUTHOR !~ /@amazon/ && $CI_MERGE_REQUEST_SQUASH_ON_MERGE == "true"
      when: always
    - when: never

