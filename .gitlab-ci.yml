    KUBERNETES_MEMORY_REQUEST: "16Gi"
    KUBERNETES_MEMORY_LIMIT: "16Gi"
  tags:
    - arch:amd64
  when: manual
  script:
    - "cd source"
    - "export version=$(cat package.json | jq -r '.version')"
    - "cd packages/@aws-accelerator/installer"
    - "yarn run cdk synth -c enable-single-account-mode=true --output $CI_PROJECT_DIR"
    - "cd ../../../../deployment"
    - "chmod +x ./build-open-source-dist.sh && ./build-open-source-dist.sh lza-on-aws-workshop"
    - "cp ./open-source/lza-on-aws-workshop.zip $CI_PROJECT_DIR/lza-on-aws-workshop.zip"
  artifacts:
    name: "lza-on-aws-workshop"
    when: on_success
    paths:
      - lza-on-aws-workshop.zip
      - AWSAccelerator-InstallerStack-Workshop.template.json
  rules:
    - if: $CI_COMMIT_BRANCH == "integ"
      when: always
    - if: $CI_COMMIT_TAG =~ /v(\d.+){2}\d/
      when: always
    - when: never
release:build-typedocs:
  stage: pipeline
  needs:
    - job: accelerator:build
      artifacts: true
  tags:
    - arch:amd64
  variables:
    KUBERNETES_CPU_REQUEST: "8"
    KUBERNETES_CPU_LIMIT: "8"
    KUBERNETES_MEMORY_REQUEST: "32Gi"
    KUBERNETES_MEMORY_LIMIT: "32Gi"
    AWS_DEFAULT_REGION: us-east-1
    AWS_CREDS_TARGET_ROLE: "${GITLAB_S3_ROLE}"
    BUILD_S3_PATH: s3://${BUCKET_NAME}/build-release/typedocs.zip
    VERSIONED_S3_PATH: s3://${BUCKET_NAME}/${CI_COMMIT_TAG}/typedocs.zip
    SITE_URL: "${GITLAB_SITE_URL}"
  before_script:
    # Install dependencies
    - "rm -rf /var/lib/apt/lists/*"
    - "apt-get update"
    - "apt-cache gencaches"
    - "apt-get install -y zip"
    - "wget --progress=dot:mega -O /tmp/awscliv2.zip https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
    - "unzip -q /tmp/awscliv2.zip -d /tmp"
    - "/tmp/aws/install"
  script:
    # Generate docs
    - "cd source"
    - "mkdir -p mkdocs/docs/typedocs"
    - "yarn docs"
    # Move to generated typedocs dir
    - "cd mkdocs/docs/typedocs"
    # Archive and upload to S3
    - "zip -rqy typedocs.zip *"
    - "aws s3 cp ./typedocs.zip ${VERSIONED_S3_PATH}"
    - "aws s3 cp ./typedocs.zip ${BUILD_S3_PATH}"
    - "cp ./typedocs.zip ${CI_PROJECT_DIR}/typedocs.zip"
  artifacts:
    name: TypeDocs
    when: on_success
    paths:
      - typedocs.zip
  rules:
    - if: $CI_PROJECT_ID == "21753" && $CI_COMMIT_TAG =~ /v(\d.+){2}\d/
      when: always
    - when: never

# =============================================================================
# Container build templates (shared by release and integ jobs)
# =============================================================================

.artifact-al2023-prep-template:
  stage: pipeline
  tags:
    - arch:amd64
  variables:
    KUBERNETES_CPU_REQUEST: "8"
    KUBERNETES_CPU_LIMIT: "8"
    KUBERNETES_MEMORY_REQUEST: "32Gi"
    KUBERNETES_MEMORY_LIMIT: "32Gi"
    VERSION: $CI_COMMIT_SHORT_SHA
  before_script:
    - dnf install nodejs22 tar gzip findutils -y
    - npm install -g yarn
  image:
    name: public.ecr.aws/amazonlinux/amazonlinux:latest
    entrypoint:
      - ""
  script:
    - "export NODE_OPTIONS=--max_old_space_size=28672"
    - "cd $CI_PROJECT_DIR/deployment && ls -lart . && $CI_PROJECT_DIR/deployment/build-s3-dist.sh lza $VERSION"
  artifacts:
    name: al2023_Prepare
    when: on_success
    untracked: true
    paths:
      - $CI_PROJECT_DIR/deployment/ecr/

.artifact-al2023-build-template:
  stage: pipeline
  tags:
    - arch:amd64
  variables:
    KUBERNETES_CPU_REQUEST: "8"
    KUBERNETES_CPU_LIMIT: "8"
    KUBERNETES_MEMORY_REQUEST: "32Gi"
    KUBERNETES_MEMORY_LIMIT: "32Gi"
    VERSION: $CI_COMMIT_SHORT_SHA
  before_script:
    - mkdir -p /kaniko/.docker
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - /kaniko/executor --context $CI_PROJECT_DIR/deployment/ecr/landing-zone-accelerator-on-aws/ --destination lza-$VERSION-al2023 --dockerfile $CI_PROJECT_DIR/deployment/ecr/landing-zone-accelerator-on-aws/Dockerfile --tarPath $CI_PROJECT_DIR/deployment/ecr/lza-$VERSION-al2023.tar.gz --no-push
  artifacts:
    name: al2023_build
    when: on_success
    paths:
      - $CI_PROJECT_DIR/deployment/ecr/lza-$VERSION-al2023.tar.gz

# =============================================================================
# Release container jobs (triggered by version tags)
# =============================================================================

# make a zip file upon commit tag
release:artifact-al2023-prep:
  extends: .artifact-al2023-prep-template
  variables:
    VERSION: $CI_COMMIT_TAG
  rules:
    - if: $CI_PROJECT_ID == "21753" && $CI_COMMIT_TAG =~ /v(\d.+){2}\d/
      when: always
    - when: never

# use created context to build
release:artifact-al2023-build:
  extends: .artifact-al2023-build-template
  needs: ["release:artifact-al2023-prep"]
  variables:
    VERSION: $CI_COMMIT_TAG
  rules:
    - if: $CI_PROJECT_ID == "21753" && $CI_COMMIT_TAG =~ /v(\d.+){2}\d/
      when: always
    - when: never

# =============================================================================
# Integ container jobs (triggered by integ branch post-merge)
# =============================================================================

integ:artifact-al2023-prep:
  extends: .artifact-al2023-prep-template
  rules:
    - if: $CI_MERGE_REQUEST_IID != null
      when: never
    - if: $CI_PROJECT_ID == "21753" && $CI_COMMIT_BRANCH == "integ"
      when: always
    - when: never

integ:artifact-al2023-build:
  extends: .artifact-al2023-build-template
  needs: ["integ:artifact-al2023-prep"]
  rules:
    - if: $CI_MERGE_REQUEST_IID != null
      when: never
    - if: $CI_PROJECT_ID == "21753" && $CI_COMMIT_BRANCH == "integ"
      when: always
    - when: never

integ:artifact-al2023-upload:
  stage: pipeline
  needs: ["integ:artifact-al2023-build"]
  tags:
    - arch:amd64
  variables:
    KUBERNETES_CPU_REQUEST: "4"
    KUBERNETES_CPU_LIMIT: "4"
    KUBERNETES_MEMORY_REQUEST: "16Gi"
    KUBERNETES_MEMORY_LIMIT: "16Gi"
    AWS_DEFAULT_REGION: us-west-2
    AWS_CREDS_TARGET_ROLE: "${LZA_GITFARM_ROLE}"
  script:
    - "wget --progress=dot:mega -O /tmp/awscliv2.zip https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
    - "unzip -q /tmp/awscliv2.zip -d /tmp"
    - "/tmp/aws/install"
    - cd $CI_PROJECT_DIR/deployment/ecr
    - TARBALL="lza-${CI_COMMIT_SHORT_SHA}-al2023.tar.gz"
    - 'test -f "$TARBALL" || { echo "ERROR: $TARBALL not found"; exit 1; }'
    - echo "Found tarball $TARBALL"
    - echo "${CI_COMMIT_SHA}" > commit-info.txt
    - zip artifact.zip "$TARBALL" commit-info.txt
    - aws s3 cp artifact.zip "s3://${LZA_GITFARM_BUCKET}/lza-integ/artifact.zip"
    - echo "Upload complete. Commit SHA ${CI_COMMIT_SHA}"
  rules:
    - if: $CI_MERGE_REQUEST_IID != null
      when: never
    - if: $CI_PROJECT_ID == "21753" && $CI_COMMIT_BRANCH == "integ"
      when: always
    - when: never

# upload artifact into package for release
release:artifact-al2023-upload:
  stage: pipeline
  needs: ["release:artifact-al2023-build"]
  tags:
    - arch:amd64
  variables:
    KUBERNETES_CPU_REQUEST: "4"
    KUBERNETES_CPU_LIMIT: "4"
    KUBERNETES_MEMORY_REQUEST: "16Gi"
    KUBERNETES_MEMORY_LIMIT: "16Gi"
    TOKEN:
  before_script:
    # ensure file exists before upload
    - ls -lart $CI_PROJECT_DIR/deployment/ecr/lza-$CI_COMMIT_TAG-al2023.tar.gz
  script:
    # uploads can only be to url/project/<project-id>/packages/generic/<package_name>/<version>/<package_file>
    # in local testing it was found that package_file must match.
    # For example, if the package file is named "test.tar.gz" then the upload url must be "url/project/<project-id>/packages/generic/<package_name>/<version>/test.tar.gz"
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file $CI_PROJECT_DIR/deployment/ecr/lza-$CI_COMMIT_TAG-al2023.tar.gz "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/lza-container/${CI_COMMIT_TAG}/lza-${CI_COMMIT_TAG}-al2023.tar.gz"
    # this echo will help in release and also allow downloads from logs directly
    - echo "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/lza-container/${CI_COMMIT_TAG}/lza-${CI_COMMIT_TAG}-al2023.tar.gz"
    # get sha1sum and add that to a file
    - sha1sum $CI_PROJECT_DIR/deployment/ecr/lza-$CI_COMMIT_TAG-al2023.tar.gz >> $CI_PROJECT_DIR/lza-$CI_COMMIT_TAG-al2023.tar.gz.sha1sum
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file $CI_PROJECT_DIR/lza-$CI_COMMIT_TAG-al2023.tar.gz.sha1sum "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/lza-container/${CI_COMMIT_TAG}/lza-${CI_COMMIT_TAG}-al2023.tar.gz.sha1sum"
  rules:
    - if: $CI_COMMIT_TAG =~ /v(\d.+){2}\d/
      when: always
    - when: never

# release based on commit tag
release:artifact-al2023-release:
  stage: pipeline
  needs: ["release:artifact-al2023-upload"]
  variables:
    KUBERNETES_CPU_REQUEST: "4"
    KUBERNETES_CPU_LIMIT: "4"
    KUBERNETES_MEMORY_REQUEST: "16Gi"
    KUBERNETES_MEMORY_LIMIT: "16Gi"
  tags:
    - arch:amd64
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script:
    # this script ensures before_script which is common to test/build will not run for this specific container
    - echo "Releasing $CI_COMMIT_TAG"
  script:
    - |
      release-cli create --name "$CI_COMMIT_TAG" --tag-name $CI_COMMIT_TAG \
        --assets-link "{\"name\":\"lza-${CI_COMMIT_TAG}-al2023.tar.gz\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/lza-container/${CI_COMMIT_TAG}/lza-${CI_COMMIT_TAG}-al2023.tar.gz\"}" \
        --assets-link "{\"name\":\"lza-${CI_COMMIT_TAG}-al2023.tar.gz.sha1sum\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/lza-container/${CI_COMMIT_TAG}/lza-${CI_COMMIT_TAG}-al2023.tar.gz.sha1sum\"}" \
        --description "Landing Zone Accelerator on AWS container version $CI_COMMIT_TAG built on AL2023"
  rules:
    - if: $CI_COMMIT_TAG =~ /v(\d.+){2}\d/
      when: always
    - when: never

release:run-tests:
  stage: pipeline
  variables:
    KUBERNETES_CPU_REQUEST: "8"
    KUBERNETES_CPU_LIMIT: "8"
    KUBERNETES_MEMORY_REQUEST: "32Gi"
    KUBERNETES_MEMORY_LIMIT: "32Gi"
  tags:
    - arch:amd64
  before_script:
    # Install dependencies
    - "rm -rf /var/lib/apt/lists/*"
    - "apt-get update"
    - "apt-cache gencaches"
  script:
    # Run tests in the same way as the AWS Solutions pipeline
    - "export NODE_OPTIONS=--max_old_space_size=28672"
    - "cd source"
    - "chmod +x ./run-all-tests.sh && ./run-all-tests.sh"
  artifacts:
    name: test-results
    when: on_success
    untracked: true
  rules:
    - if: $CI_PROJECT_ID == "21753" && $CI_COMMIT_TAG =~ /v(\d.+){2}\d/
      when: always
    - when: never

release:build-distributions:
  stage: pipeline
  needs:
    - job: release:run-tests
      artifacts: true
  tags:
    - arch:amd64
  variables:
    KUBERNETES_CPU_REQUEST: "8"
    KUBERNETES_CPU_LIMIT: "8"
    KUBERNETES_MEMORY_REQUEST: "32Gi"
    KUBERNETES_MEMORY_LIMIT: "32Gi"
