# Yarn (Berry) configuration. Replaces the Yarn 1 .yarnrc and lerna.
# The Yarn release binary is vendored under .yarn/releases so builds work in
# locked-down / airgapped environments (CodeBuild, GovCloud, isolated partitions)
# without corepack or network access.
yarnPath: .yarn/releases/yarn-4.10.3.cjs

# Keep the classic node_modules layout instead of Plug'n'Play so the existing
# build, CDK synth, and test tooling continues to work unchanged.
nodeLinker: node-modules
